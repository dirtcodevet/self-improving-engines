<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One round of recursive improvement</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="468" rx="18" fill="none" stroke="#d0d7de"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1f2328">One round</text>
  <text x="40" y="70" font-size="14" fill="#57606a">Each round leaves the engine better and leaves its lesson behind, so no mistake is paid for twice.</text>

  <g font-size="14" fill="#1f2328">
    <!-- top row, left to right -->
    <rect x="40" y="100" width="190" height="78" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="56" y="128" font-weight="700">1  Run blind</text>
    <text x="56" y="150" fill="#57606a" font-size="13">a fresh builder; the</text>
    <text x="56" y="167" fill="#57606a" font-size="13">answer key out of reach</text>

    <rect x="265" y="100" width="190" height="78" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="281" y="128" font-weight="700">2  Self-review</text>
    <text x="281" y="150" fill="#57606a" font-size="13">every check, full detail,</text>
    <text x="281" y="167" fill="#57606a" font-size="13">before anyone looks</text>

    <rect x="490" y="100" width="190" height="78" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="506" y="128" font-weight="700">3  Score outside</text>
    <text x="506" y="150" fill="#57606a" font-size="13">code compares with the</text>
    <text x="506" y="167" fill="#57606a" font-size="13">hidden answer key</text>

    <rect x="715" y="100" width="205" height="78" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="731" y="128" font-weight="700">4  Log the round</text>
    <text x="731" y="150" fill="#57606a" font-size="13">what was found, its cause,</text>
    <text x="731" y="167" fill="#57606a" font-size="13">the general fix</text>

    <!-- bottom row, right to left -->
    <rect x="715" y="250" width="205" height="78" rx="12" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="731" y="278" font-weight="700">5  Fix the ability</text>
    <text x="731" y="300" fill="#57606a" font-size="13">never the case: case facts</text>
    <text x="731" y="317" fill="#57606a" font-size="13">stay in the case's folder</text>

    <rect x="490" y="250" width="190" height="78" rx="12" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="506" y="278" font-weight="700">6  Defect → check</text>
    <text x="506" y="300" fill="#57606a" font-size="13">proven on a planted copy</text>
    <text x="506" y="317" fill="#57606a" font-size="13">of the defect</text>

    <rect x="265" y="250" width="190" height="78" rx="12" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="281" y="278" font-weight="700">7  Teach the skill</text>
    <text x="281" y="300" fill="#57606a" font-size="13">lessons cite evidence;</text>
    <text x="281" y="317" fill="#57606a" font-size="13">a person approves them</text>

    <rect x="40" y="250" width="190" height="78" rx="12" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="56" y="278" font-weight="700">8  Regression</text>
    <text x="56" y="300" fill="#57606a" font-size="13">frozen reference cases</text>
    <text x="56" y="317" fill="#57606a" font-size="13">must reproduce</text>
  </g>

  <g stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="232" y1="139" x2="262" y2="139"/>
    <line x1="457" y1="139" x2="487" y2="139"/>
    <line x1="682" y1="139" x2="712" y2="139"/>
    <path d="M817,180 L817,247"/>
    <line x1="713" y1="289" x2="683" y2="289"/>
    <line x1="488" y1="289" x2="458" y2="289"/>
    <line x1="263" y1="289" x2="233" y2="289"/>
    <path d="M135,248 L135,181"/>
  </g>
  <text x="150" y="220" font-size="12" fill="#57606a">next round</text>

  <g font-size="13.5" fill="#1f2328">
    <rect x="40" y="360" width="430" height="80" rx="12" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="56" y="386" font-weight="700">The ratchet</text>
    <text x="56" y="407" fill="#57606a">Checks and fixes may be added freely. Removing a check,</text>
    <text x="56" y="425" fill="#57606a">loosening a threshold or changing a weight needs a person.</text>

    <rect x="490" y="360" width="430" height="80" rx="12" fill="#fbefff" stroke="#c297ff"/>
    <text x="506" y="386" font-weight="700">Graduation</text>
    <text x="506" y="407" fill="#57606a">A human check steps back to a sampled audit only when the</text>
    <text x="506" y="425" fill="#57606a">checks are measured to beat it, and returns in proportion to misses.</text>
  </g>
</svg>
