<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Measure, map, refine: how the engine changes a 3-D asset</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="300" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="298" rx="18" fill="none" stroke="#d0d7de"/>
  <text x="40" y="46" font-size="20" font-weight="700" fill="#1f2328">Measure, map, refine</text>
  <text x="40" y="70" font-size="14" fill="#57606a">Every change to the asset is a stage that replays from the start, with the same table of measures before and after.</text>

  <g font-size="14" fill="#1f2328">
    <rect x="40" y="100" width="150" height="110" rx="12" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="56" y="128" font-weight="700">3-D asset</text>
    <text x="56" y="150" fill="#57606a" font-size="13">a generator's model,</text>
    <text x="56" y="167" fill="#57606a" font-size="13">a scan, or an earlier</text>
    <text x="56" y="184" fill="#57606a" font-size="13">approved model</text>

    <rect x="220" y="100" width="160" height="110" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="236" y="128" font-weight="700">Translator</text>
    <text x="236" y="150" fill="#57606a" font-size="13">your clicks become</text>
    <text x="236" y="167" fill="#57606a" font-size="13">exact addresses</text>
    <text x="236" y="184" fill="#57606a" font-size="13">your AI can act on</text>

    <rect x="410" y="100" width="160" height="110" rx="12" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="426" y="128" font-weight="700">Measures</text>
    <text x="426" y="150" fill="#57606a" font-size="13">descriptors proven on</text>
    <text x="426" y="167" fill="#57606a" font-size="13">a known shape; ranked</text>
    <text x="426" y="184" fill="#57606a" font-size="13">targets with sources</text>

    <rect x="600" y="100" width="150" height="110" rx="12" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="616" y="128" font-weight="700">Solve</text>
    <text x="616" y="150" fill="#57606a" font-size="13">smooth handles that</text>
    <text x="616" y="167" fill="#57606a" font-size="13">are real mechanisms,</text>
    <text x="616" y="184" fill="#57606a" font-size="13">on one region</text>

    <rect x="780" y="100" width="140" height="110" rx="12" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="796" y="128" font-weight="700">Gate</text>
    <text x="796" y="150" fill="#57606a" font-size="13">no new folds; the</text>
    <text x="796" y="167" fill="#57606a" font-size="13">person's approvals</text>
    <text x="796" y="184" fill="#57606a" font-size="13">re-checked</text>
  </g>
  <g stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#b)">
    <line x1="192" y1="155" x2="217" y2="155"/>
    <line x1="382" y1="155" x2="407" y2="155"/>
    <line x1="572" y1="155" x2="597" y2="155"/>
    <line x1="752" y1="155" x2="777" y2="155"/>
    <path d="M850,212 C850,262 300,262 300,213"/>
  </g>
  <text x="440" y="276" font-size="13" fill="#57606a">the Translator is rebuilt on the changed model</text>
</svg>
